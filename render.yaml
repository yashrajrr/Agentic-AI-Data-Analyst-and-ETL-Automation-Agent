services:
  - type: web
    name: data-ai-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: host
        sync: false
      - key: port
        value: 5432
      - key: database
        sync: false
      - key: user
        sync: false
      - key: password
        sync: false
